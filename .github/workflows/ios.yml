name: iOS CI and TestFlight

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'scripts/ci/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to TestFlight after all checks pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Workflow and script checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/ci/*.sh

  ios:
    name: iPhone simulator tests
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: bash scripts/ci/install-xcodegen.sh
      - name: Check selected Xcode
        run: xcodebuild -version
      - name: Run native regression and Cloudflare sharing integration
        run: bash scripts/ci/test-ios.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-checks-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-coverage.json
            ${{ runner.temp }}/ios-tests.log
          retention-days: 7

  testflight:
    name: Upload and verify TestFlight
    needs: [checks, ios]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: pocket-explorer-testflight
      cancel-in-progress: false
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps/6810920731/testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      APPLE_TEAM_ID: 5B858997A3
      APP_STORE_CONNECT_APP_ID: '6810920731'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios
      - run: bash scripts/ci/install-xcodegen.sh
      - run: xcodegen generate
        working-directory: ios
      - name: Sign, upload, wait for processing and assign internal testers
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: bundle exec fastlane ios beta
      - name: Remove temporary signing files
        if: always()
        run: bash scripts/ci/clean-signing.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: testflight-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-result.json
          if-no-files-found: ignore
          retention-days: 30
